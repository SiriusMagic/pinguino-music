# Compila la app y la publica en GitHub Pages en cada cambio a main.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npx expo export -p web && cp dist/index.html dist/404.html
        env:
          EXPO_BASE_URL: /pinguino-music
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          path: frontend/dist

  deploy:
    # GitHub Pages gratis solo funciona en repos públicos.
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
