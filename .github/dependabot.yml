# Seguridad: un PR agrupado cuando una librería tiene un fallo conocido.
# Versiones: cada mes, un PR con las actualizaciones menores y otro con las mayores.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Expo fija las versiones compatibles de estos paquetes para cada SDK.
    # Se actualizan con "npx expo install --fix" (o al cambiar de SDK), no con Dependabot.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
      - dependency-name: "eslint"
      - dependency-name: "eslint-config-expo"
    groups:
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
      menores:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      mayores:
        applies-to: version-updates
        update-types: ["major"]
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      acciones:
        patterns: ["*"]
